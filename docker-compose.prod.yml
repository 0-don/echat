version: "3.8"

services:
  echat-web:
    container_name: echat-web
    build:
      context: web/
      dockerfile: Dockerfile
      target: prod
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - proxy
    labels:
      - 'autoheal=true'
      - 'traefik.enable=true'
      - 'traefik.http.routers.echat-web.rule=Host(`echat.coding-global.com`)'
      - 'traefik.http.routers.echat-web.entrypoints=websecure'
      - 'traefik.http.routers.echat-web.tls.certresolver=letsencrypt'
      - 'traefik.http.services.echat-web.loadbalancer.server.port=3000'
  echat-server:
    container_name: echat-server
    build:
      context: server/
      dockerfile: Dockerfile
      target: prod
    restart: always
    healthcheck:
      # Apollo answers 404 on / and 400 on a plain GET to /graphql, so any HTTP
      # status means the server is up: check the port instead of a status code.
      test: ["CMD-SHELL", "netstat -tln | grep -q ':4001'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - echat-db
    env_file:
      - server/.env
    environment:
      - DATABASE_URL=postgres://postgres:9oQX2RUHuHzwjy@echat-db:5432/echat
    networks:
      - proxy
    labels:
      - 'autoheal=true'
      - 'traefik.enable=true'
      - 'traefik.http.routers.echat-server.rule=Host(`echat.coding-global.com`) && PathPrefix(`/graphql`)'
      - 'traefik.http.routers.echat-server.entrypoints=websecure'
      - 'traefik.http.routers.echat-server.tls.certresolver=letsencrypt'
      - 'traefik.http.services.echat-server.loadbalancer.server.port=4001'
  echat-db:
    container_name: echat-db
    image: postgres:14
    restart: always
    environment:
      - POSTGRES_PASSWORD=9oQX2RUHuHzwjy
      - POSTGRES_USER=postgres
      - POSTGRES_DB=echat
    networks:
      - proxy

networks:
  proxy:
    external: false
    name: proxy
